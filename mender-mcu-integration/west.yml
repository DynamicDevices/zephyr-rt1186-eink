manifest:

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: mender
      url-base: https://github.com/mendersoftware
    - name: dynamicdevices
      url-base: https://github.com/DynamicDevices

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        name-allowlist:
          - cmsis_6
          - mbedtls
          - tf-psa-crypto
          - mcuboot
          - hal_nxp
          - hal_nordic
          - hal_espressif
          - littlefs
    - name: mender-mcu
      remote: dynamicdevices
      # Full SHA required: CI/shallow west update cannot resolve abbreviated refs.
      # Shared pin policy: https://github.com/DynamicDevices/mender-mcu/blob/feature/zephyr-ram-stage-on-main/PIN-POLICY.md
      revision: 64c10faad9d9150fd85202914c79c7d4c067dcd2
      path: modules/mender-mcu
      import: true
    - name: improv-zephyr
      url: https://github.com/beriberikix/improv-zephyr
      revision: b65d2aaa39d48ec0fee11aa3eecd0609bbe30f3c
      path: modules/improv-zephyr
    - name: wasm-micro-runtime
      url: https://github.com/bytecodealliance/wasm-micro-runtime
      # WAMR v2.4.3 development snapshot proven with Zephyr v4.4.0 on
      # mimxrt1170_evk/mimxrt1176/cm7 and the exact ARM ELF in Renode.
      revision: 8295a7ed80dd033362d06a1492857d4c6f9b6900
      path: modules/wasm-micro-runtime

  self:
    path: mender-mcu-integration
